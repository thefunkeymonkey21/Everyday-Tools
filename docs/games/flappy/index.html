<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Wings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070B12;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
    }
    .hud .val {
      color: #F59E0B;
      font-family: monospace;
      font-size: 18px;
    }
    #game-container {
      position: relative;
      border: 2px solid #1E293B;
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.12);
      background: #38BDF8;
      cursor: pointer;
    }
    canvas {
      display: block;
      border-radius: 6px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 18, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 6px;
    }
    .overlay.hidden { display: none; }
    .title {
      font-size: 26px;
      font-weight: 800;
      color: #F59E0B;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 13px;
      color: #94A3B8;
    }
    button.btn {
      padding: 10px 24px;
      background: #F59E0B;
      color: #451A03;
      font-weight: 700;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.btn:hover {
      background: #FBBF24;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score" class="val">0</span></div>
    <div>BEST: <span id="best" class="val">0</span></div>
  </div>

  <div id="game-container">
    <canvas id="canvas" width="360" height="480"></canvas>
    <div id="overlay" class="overlay">
      <div id="overlay-title" class="title">FLAPPY WINGS</div>
      <div id="overlay-sub" class="subtitle">Press Space or Click to flap</div>
      <button id="start-btn" class="btn">START FLAPPING</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');

    let isPlaying = false;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('vault_flappy_best') || '0', 10);
    bestEl.textContent = bestScore;

    const bird = {
      x: 60,
      y: 200,
      radius: 14,
      velocity: 0,
      gravity: 0.35,
      jump: -6.5,
      rotation: 0
    };

    let pipes = [];
    let clouds = [];
    let frameCount = 0;
    let animId = null;

    function initClouds() {
      clouds = [
        { x: 30, y: 50, speed: 0.5, r: 24 },
        { x: 180, y: 90, speed: 0.4, r: 18 },
        { x: 300, y: 40, speed: 0.6, r: 28 }
      ];
    }

    function flap() {
      if (!isPlaying) {
        startGame();
        return;
      }
      bird.velocity = bird.jump;
    }

    function createPipe() {
      const gap = 110;
      const minTop = 50;
      const maxTop = canvas.height - 100 - gap;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + gap,
        width: 48,
        passed: false
      });
    }

    function startGame() {
      score = 0;
      scoreEl.textContent = score;
      bird.y = 200;
      bird.velocity = 0;
      bird.rotation = 0;
      pipes = [];
      frameCount = 0;
      initClouds();
      isPlaying = true;
      overlay.classList.add('hidden');
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function gameOver() {
      isPlaying = false;
      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#EF4444';
      overlaySub.textContent = 'Score: ' + score + ' (Best: ' + bestScore + ')';
      startBtn.textContent = 'TRY AGAIN';
      overlay.classList.remove('hidden');
    }

    function loop() {
      if (!isPlaying) return;
      frameCount++;

      // Update Bird
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;
      bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.08));

      // Ceiling & floor collision
      if (bird.y - bird.radius <= 0) {
        bird.y = bird.radius;
        bird.velocity = 0;
      }
      if (bird.y + bird.radius >= canvas.height - 50) {
        gameOver();
        return;
      }

      // Update Pipes
      if (frameCount % 90 === 0) {
        createPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.2;

        // Score pass
        if (!p.passed && p.x + p.width < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            localStorage.setItem('vault_flappy_best', bestScore);
          }
        }

        // Pipe collision
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + p.width
        ) {
          if (bird.y - bird.radius < p.top || bird.y + bird.radius > p.bottom) {
            gameOver();
            return;
          }
        }

        // Remove offscreen
        if (p.x + p.width < 0) {
          pipes.splice(i, 1);
        }
      }

      // Update Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = canvas.width + 40;
      });

      render();
      animId = requestAnimationFrame(loop);
    }

    function render() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#38BDF8');
      skyGrad.addColorStop(0.7, '#7DD3FC');
      skyGrad.addColorStop(1, '#BAE6FD');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.arc(c.x + c.r * 0.7, c.y - 6, c.r * 0.8, 0, Math.PI * 2);
        ctx.arc(c.x + c.r * 1.4, c.y, c.r * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
        pipeGrad.addColorStop(0, '#22C55E');
        pipeGrad.addColorStop(0.5, '#4ADE80');
        pipeGrad.addColorStop(1, '#15803D');

        ctx.fillStyle = pipeGrad;
        ctx.strokeStyle = '#0F5132';
        ctx.lineWidth = 2;

        // Top body
        ctx.fillRect(p.x, 0, p.width, p.top);
        ctx.strokeRect(p.x, 0, p.width, p.top);
        // Top cap
        ctx.fillRect(p.x - 3, p.top - 16, p.width + 6, 16);
        ctx.strokeRect(p.x - 3, p.top - 16, p.width + 6, 16);

        // Bottom body
        const botH = canvas.height - 50 - p.bottom;
        ctx.fillRect(p.x, p.bottom, p.width, botH);
        ctx.strokeRect(p.x, p.bottom, p.width, botH);
        // Bottom cap
        ctx.fillRect(p.x - 3, p.bottom, p.width + 6, 16);
        ctx.strokeRect(p.x - 3, p.bottom, p.width + 6, 16);
      });

      // Ground
      ctx.fillStyle = '#65A30D';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 14);
      ctx.fillStyle = '#78350F';
      ctx.fillRect(0, canvas.height - 36, canvas.width, 36);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Body
      ctx.fillStyle = '#F59E0B';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#78350F';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.fillStyle = '#FCD34D';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(6, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0F172A';
      ctx.beginPath();
      ctx.arc(8, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#EF4444';
      ctx.beginPath();
      ctx.moveTo(11, -1);
      ctx.lineTo(19, 2);
      ctx.lineTo(11, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    document.getElementById('game-container').addEventListener('mousedown', (e) => {
      if (e.target !== startBtn) flap();
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    initClouds();
    render();
  </script>
</body>
</html>
